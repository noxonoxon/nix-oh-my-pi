name: Build oh-my-pi

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.system }})

    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto
            cores = 0

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: nox
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
          extraPullNames: nix-community

      - name: Build oh-my-pi
        id: build
        run: |
          out=$(nix build \
            --print-out-paths \
            --no-link \
            --print-build-logs \
            --keep-going \
            github:can1357/oh-my-pi/v18.16.0#default)
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "Built: $out"

      - name: Push package
        run: |
          out="${{ steps.build.outputs.out }}"
          echo "Pushing: $out"
          nix-store -qR "$out" | cachix push nox
